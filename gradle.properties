# ------------------------------------------------------------
# Kotlin configuration
# ------------------------------------------------------------
kotlin.code.style=official
kotlin.daemon.jvmargs=Xmx2g
# ------------------------------------------------------------
# Gradle configuration
# ------------------------------------------------------------
org.gradle.jvmargs=-XX:MaxMetaspaceSize=512m
org.gradle.caching=true
org.gradle.configuration-cache=true
# ------------------------------------------------------------
# arara configuration
# ------------------------------------------------------------
arara.jvm.target=11
arara.kotlin.target=2.4.0
arara.pinned=org.jetbrains.kotlin:kotlin-stdlib
# ------------------------------------------------------------
# smoke suite configuration
# ------------------------------------------------------------
# the smoke floor is the version, not the vendor: Java 11 has
# retired from the mainstream catalogues, so the resolver finds
# whichever distribution still ships it, and any local 11 serves
# the floor just as honestly
smoke.jvm.version=11
