[versions]
clikt-version = "5.0.3"
detekt-version = "1.23.8"
dokka-version = "2.2.0"
kotlin-version = "2.4.20"
kotlin-logging-version = "8.0.4"
kotaml-version = "0.111.0"
kotlinx-serialization-version = "1.11.0"
kover-version = "0.9.9"
log4j-version = "2.25.2"
luaj-version = "1.0.3"
mvel-version = "2.5.4.Final"
okio-version = "3.18.2"
shadow-version = "9.6.1"
slf4j-version = "2.0.17"
spotless-changelog-version = "3.1.2"
spotless-version = "8.10.2"
tapmoc-version = "0.4.2"
versions-version = "0.64.0"
zt-exec-version = "1.12"

[libraries]
clikt = { group = "com.github.ajalt.clikt", name = "clikt", version.ref = "clikt-version" }
clikt-markdown = { group = "com.github.ajalt.clikt", name = "clikt-markdown", version.ref = "clikt-version" }
kotaml = { group = "io.heapy.kotaml", name = "kotaml", version.ref = "kotaml-version" }
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging", version.ref = "kotlin-logging-version" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin-version" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin-version" }
luaj = { group = "io.github.taoguan", name = "luaj", version.ref = "luaj-version" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinx-serialization-version" }
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j-version" }
log4j-impl = { group = "org.apache.logging.log4j", name = "log4j-slf4j2-impl", version.ref = "log4j-version" }
mvel = { group = "org.mvel", name = "mvel2", version.ref = "mvel-version" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio-version" }
okio-fakefilesystem = { group = "com.squareup.okio", name = "okio-fakefilesystem", version.ref = "okio-version" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j-version" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j-version" }
zt-exec = { group = "org.zeroturnaround", name = "zt-exec", version.ref = "zt-exec-version" }

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt-version" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka-version" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-version" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-version" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover-version" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow-version" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless-version" }
spotless-changelog = { id = "com.diffplug.spotless-changelog", version.ref = "spotless-changelog-version" }
tapmoc = { id = "com.gradleup.tapmoc", version.ref = "tapmoc-version" }
versions = { id = "io.github.ben-manes.versions", version.ref = "versions-version" }
