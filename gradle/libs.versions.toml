zt-exec = { group = "org.zeroturnaround", name = "zt-exec", version.ref = "zt-exec-version" }

[plugins]
chronoheader = { id = "org.islandoftex.chronoheader", version.ref = "chronoheader-version" }
leopack-scribeswan = { id = "org.islandoftex.leopack.scribeswan", version.ref = "leopack-version" }
