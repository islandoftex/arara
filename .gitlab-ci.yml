variables:
  # disable the Gradle daemon for Continuous Integration servers
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx6g"
  GIT_SUBMODULE_STRATEGY: recursive
  AST_ENABLE_MR_PIPELINES: "true"

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

# Prefer an MR pipeline over a duplicate feature-branch pipeline for the same push.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

.pipeline-job:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

stages:
  - build
  - test
  - pages
  - publish

before_script:
  - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle"

# The application requires Java 21; CI also verifies the latest LTS, Java 25.
# Minimal Corretto images omit xargs, which the Gradle wrapper requires.
.corretto:
  extends: .pipeline-job
  before_script:
    - yum install -y findutils
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle"

.cachetemplate: &cachedefinition
  key: "gradle-linux-$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
    - .gradle/build-cache/

# Each test runtime caches its test dependencies and task outputs; only the build job writes
# the shared compilation/dependency cache. Gradle keys also include task inputs.
.testcache: &testcachedefinition
  key: "gradle-tests-linux-$CI_COMMIT_REF_SLUG-$JAVA_VERSION"
  paths:
    - .gradle/caches/
    - .gradle/build-cache/
  policy: pull-push
  when: always

.buildtemplate: &builddefinition
  stage: build
  script:
    # create the executables for distribution
    - ./gradlew --build-cache assembleDist stageProcessSmokeJar -PwarningsAsErrors=true --info
    - mkdir bin
    - cp cli/build/libs/*.jar bin/
    - cp cli/build/native/jna.jar bin/
    - cp cli/build/distributions/*.zip bin/
    # create checksum file to make sure we're distributing the right thing
    - cd bin
    - md5sum *.{jar,zip} > checksums.txt
  artifacts:
    name: "$CI_COMMIT_REF_NAME-snapshot"
    paths:
      - bin
      - build/processSmoke/arara.jar
      - build/processSmoke/runner.jar
      - build/processSmoke/jna.jar
    expire_in: 1 week
  cache:
    <<: *cachedefinition
    policy: pull-push

build:linux:jdk21:
  extends: .corretto
  image: amazoncorretto:21
  <<: *builddefinition

.testtemplate: &testdefinition
  stage: test
  script:
    - ./gradlew --build-cache allTests -PwarningsAsErrors=true -PtestJavaVersion="$JAVA_VERSION"
    - ./gradlew --build-cache koverXmlReport koverHtmlReport koverVerify -PwarningsAsErrors=true -PtestJavaVersion="$JAVA_VERSION"
  cache:
    - <<: *cachedefinition
      policy: pull
    - <<: *testcachedefinition
  artifacts:
    name: "tests-java$JAVA_VERSION"
    when: always
    reports:
      junit:
        - "*/build/test-results/jvmTest/TEST-*.xml"
        - "smoke-tests/build/test-results/test/TEST-*.xml"
      coverage_report:
        coverage_format: jacoco
        path: build/reports/kover/report.xml
    paths:
      - build/reports/kover/
      - "*/build/reports/kover/"
    expire_in: 1 week

test:process-smoke:
  extends: .pipeline-job
  stage: test
  needs: ["build:linux:jdk21"]
  image: amazoncorretto:$JAVA_VERSION
  parallel:
    matrix:
      - JAVA_VERSION: ["21", "25"]
  script:
    - java -jar build/processSmoke/runner.jar --jar build/processSmoke/arara.jar --java "$JAVA_HOME/bin/java"
  artifacts:
    when: always
    name: "process-smoke-$JAVA_VERSION"
    reports:
      junit: build/test-results/processSmoke/results.xml
    paths:
      - build/test-results/processSmoke/results.xml
    expire_in: 1 week

# The TeX Live image includes Java; the staged runner needs no compiler or Gradle.
test:tex-integration:
  extends: .pipeline-job
  stage: test
  needs: ["build:linux:jdk21"]
  image: registry.gitlab.com/islandoftex/images/texlive:latest
  script:
    - java -version
    - >-
      java -jar build/processSmoke/runner.jar --suite tex
      --jar build/processSmoke/arara.jar --java "$(command -v java)"
      --work-dir build/texIntegration
      --report build/test-results/texIntegration/results.xml
  artifacts:
    when: always
    reports:
      junit: build/test-results/texIntegration/results.xml
    paths:
      - build/test-results/texIntegration/results.xml
      - build/texIntegration/
    expire_in: 1 week

test:publications:
  extends: .corretto
  stage: test
  needs:
    - job: build:linux:jdk21
      artifacts: false
  image: amazoncorretto:21
  script:
    - ./gradlew --build-cache checkPublications dokkaGeneratePublicationHtml -PwarningsAsErrors=true
  cache:
    <<: *cachedefinition
    policy: pull
  artifacts:
    paths:
      - build/dokka/html
    expire_in: 1 week

test:dependencies:
  extends: .corretto
  stage: test
  needs:
    - job: build:linux:jdk21
      artifacts: false
  image: amazoncorretto:21
  script:
    - ./gradlew --build-cache dependencyUpdates
  cache:
    <<: *cachedefinition
    policy: pull

test:static:
  extends: .corretto
  stage: test
  needs:
    - job: build:linux:jdk21
      artifacts: false
  image: amazoncorretto:21
  script:
    - ./gradlew --build-cache spotlessCheck detekt -PwarningsAsErrors=true
  cache:
    <<: *cachedefinition
    policy: pull

test:build-logic:
  extends: .corretto
  stage: test
  needs:
    - job: build:linux:jdk21
      artifacts: false
  image: amazoncorretto:21
  script:
    - ./gradlew --build-cache checkRuntimeDependencies -PwarningsAsErrors=true
    - ./gradlew --build-cache -p buildSrc check
  cache:
    <<: *cachedefinition
    policy: pull

test:linux:jdk21:
  variables:
    JAVA_VERSION: "21"
  extends: .corretto
  needs:
    - job: build:linux:jdk21
      artifacts: false
  image: amazoncorretto:21
  <<: *testdefinition

test:linux:jdk25:
  variables:
    JAVA_VERSION: "25"
  extends: .corretto
  needs:
    - job: build:linux:jdk21
      artifacts: false
  image: amazoncorretto:25
  <<: *testdefinition
  cache:
    - <<: *cachedefinition
      policy: pull
    - <<: *testcachedefinition
    - key: "java21-toolchain-linux-amd64-v1"
      paths:
        - .gradle/jdks/
      policy: pull-push
      when: always

build:docs:
  stage: build
  image: nixpkgs/nix-flakes:latest-x86_64-linux
  needs: []
  variables:
    PRELEASE: "false"
  script:
    - nix develop -c ./gradlew --build-cache :docs:buildDocs -Prelease=$PRELEASE -PwarningsAsErrors=true
  cache:
    key: "documentation-$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
      - .gradle/build-cache/
    policy: pull-push
  artifacts:
    name: "$CI_COMMIT_REF_SLUG-documentation"
    paths:
      - website/public
      - docs/*.pdf
      - .gradle/build-cache/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        PRELEASE: "true"
    - when: on_success

# No needs: keep the stage barrier so every required verification gates deployment.
pages:deploy:
  stage: pages
  image: alpine:3.23
  variables:
    GIT_STRATEGY: empty
  dependencies:
    - build:docs
  script:
    - test -s website/public/index.html
  pages:
    publish: website/public
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "master"'

publish:gitlab:
  dependencies: []
  extends: .corretto
  image: amazoncorretto:21
  stage: publish
  script:
    - ./gradlew --build-cache publishAllPublicationsToGitLabRepository -PwarningsAsErrors=true -PjobToken=$CI_JOB_TOKEN -Prelease=true
  cache:
    <<: *cachedefinition
    policy: pull
  rules:
    - if: '$CI_COMMIT_TAG != null'

.ctantemplate: &ctandefinition
  stage: publish
  image: nixpkgs/nix-flakes:latest-x86_64-linux
  script:
    - nix develop -c ./gradlew --build-cache -Prelease=$PRELEASE assembleCTAN -PwarningsAsErrors=true --info
    - cp build/*.zip ./
  artifacts:
    name: "$CI_COMMIT_REF_NAME-ctan"
    paths:
      - ./*.zip
      - docs/*.pdf
    expire_in: 1 week
  cache:
    <<: *cachedefinition
    policy: pull

publish:snapshot_tdszip:
  dependencies:
    - build:docs
  variables:
    PRELEASE: "false"
  <<: *ctandefinition
  rules:
    - if: '$CI_COMMIT_TAG == null && $CI_MERGE_REQUEST_ID == null && $CI_COMMIT_REF_NAME == "development"'
    - if: '$CI_COMMIT_TAG == null && $CI_MERGE_REQUEST_ID == null && $CI_COMMIT_REF_NAME == "master"'

publish:tdszip:
  dependencies:
    - build:docs
  variables:
    PRELEASE: "true"
  <<: *ctandefinition
  rules:
    - if: '$CI_COMMIT_TAG != null'
