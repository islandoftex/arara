variables:
  # disable the Gradle daemon for Continuous Integration servers
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx6g"
  GIT_SUBMODULE_STRATEGY: recursive

include:
  - template: SAST.gitlab-ci.yml
  - template: Dependency-Scanning.gitlab-ci.yml

stages:
  - build
  - test
  - pages
  - publish

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

# The application requires Java 21; CI also verifies the latest LTS, Java 25.
# Minimal Corretto images omit xargs, which the Gradle wrapper requires.
.corretto:
  before_script:
    - yum install -y findutils
    - export GRADLE_USER_HOME=`pwd`/.gradle

.cachetemplate: &cachedefinition
  key: "$CI_COMMIT_REF_NAME-$JAVA_VERSION"
  paths:
    - build
    - api/build
    - core/build
    - cli/build
    - .gradle

.buildtemplate: &builddefinition
  stage: build
  script:
    # create the executables for distribution
    - ./gradlew --build-cache assembleDist stageProcessSmokeJar --info
    - mkdir bin
    - cp cli/build/libs/*.jar bin/
    - cp cli/build/native/jna.jar bin/
    - cp cli/build/distributions/*.zip bin/
    # create checksum file to make sure we're distributing the right thing
    - cd bin
    - md5sum *.{jar,zip} > checksums.txt
  artifacts:
    name: "$CI_COMMIT_REF_NAME-snapshot"
    paths:
      - bin
      - build/processSmoke/arara.jar
      - build/processSmoke/runner.jar
      - build/processSmoke/jna.jar
    expire_in: 1 week
  cache:
    <<: *cachedefinition
    policy: push

build:linux:jdk21:
  extends: .corretto
  image: amazoncorretto:21
  <<: *builddefinition

.testtemplate: &testdefinition
  stage: test
  script:
    - ./gradlew checkRuntimeDependencies allTests -PtestJavaVersion="$JAVA_VERSION"
    - ./gradlew -p buildSrc check
    - ./gradlew detekt
    - ./gradlew koverXmlReport koverHtmlReport koverVerify -PtestJavaVersion="$JAVA_VERSION"
  cache:
    <<: *cachedefinition
    policy: pull
  artifacts:
    when: always
    reports:
      junit:
        - "*/build/test-results/jvmTest/TEST-*.xml"
        - "smoke-tests/build/test-results/test/TEST-*.xml"
      coverage_report:
        coverage_format: jacoco
        path: build/reports/kover/report.xml
    paths:
      - build/reports/kover/
      - "*/build/reports/kover/"
    expire_in: 1 week

test:process-smoke:
  stage: test
  needs: ["build:linux:jdk21"]
  image: amazoncorretto:$JAVA_VERSION
  parallel:
    matrix:
      - JAVA_VERSION: ["21", "25"]
  script:
    - java -jar build/processSmoke/runner.jar --jar build/processSmoke/arara.jar --java "$JAVA_HOME/bin/java"
  artifacts:
    when: always
    name: "process-smoke-$JAVA_VERSION"
    reports:
      junit: build/test-results/processSmoke/results.xml
    paths:
      - build/test-results/processSmoke/results.xml
    expire_in: 1 week

# The TeX Live image includes Java; the staged runner needs no compiler or Gradle.
test:tex-integration:
  stage: test
  needs: ["build:linux:jdk21"]
  image: registry.gitlab.com/islandoftex/images/texlive:latest
  script:
    - java -version
    - >-
      java -jar build/processSmoke/runner.jar --suite tex
      --jar build/processSmoke/arara.jar --java "$(command -v java)"
      --work-dir build/texIntegration
      --report build/test-results/texIntegration/results.xml
  artifacts:
    when: always
    reports:
      junit: build/test-results/texIntegration/results.xml
    paths:
      - build/test-results/texIntegration/results.xml
      - build/texIntegration/
    expire_in: 1 week

test:publications:
  extends: .corretto
  stage: test
  needs: ["build:linux:jdk21"]
  image: amazoncorretto:21
  script:
    - ./gradlew checkPublications dokkaGeneratePublicationHtml
  cache:
    <<: *cachedefinition
    policy: pull
  artifacts:
    paths:
      - build/dokka/html
    expire_in: 1 week

test:dependencies:
  extends: .corretto
  stage: test
  needs: ["build:linux:jdk21"]
  image: amazoncorretto:21
  script:
    - ./gradlew dependencyUpdates
  cache:
    <<: *cachedefinition
    policy: pull

test:spotless:
  extends: .corretto
  stage: test
  needs: ["build:linux:jdk21"]
  image: amazoncorretto:21
  script:
    - ./gradlew spotlessCheck
  cache:
    <<: *cachedefinition
    policy: pull

test:linux:jdk21:
  variables:
    JAVA_VERSION: "21"
  extends: .corretto
  needs: ["build:linux:jdk21"]
  image: amazoncorretto:21
  <<: *testdefinition

test:linux:jdk25:
  variables:
    JAVA_VERSION: "25"
  extends: .corretto
  needs: ["build:linux:jdk21"]
  image: amazoncorretto:25
  <<: *testdefinition
  cache:
    - <<: *cachedefinition
      policy: pull
    - key: "java21-toolchain-linux-amd64-v1"
      paths:
        - .gradle/jdks/
      policy: pull-push
      when: always

.pagestemplate: &pagesdefinition
  stage: pages
  image: nixpkgs/nix-flakes:latest-x86_64-linux
  needs: []
  script:
    - nix build .#website
    # GL pages needs the artifact at the root directory, the manual in website
    - cp -r result/public ./public
    - cp -r result/public ./website/public

pages:
  <<: *pagesdefinition
  artifacts:
    paths:
      - public
      # this is required for building the manual and quickstart PDF
      - website/public
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
    - if: '$CI_COMMIT_TAG'

pages:for-manual:
  <<: *pagesdefinition
  artifacts:
    paths:
      # this is required for building the manual and quickstart PDF
      - website/public
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_REF_NAME != "master"'
    - if: '$CI_COMMIT_TAG == null'

publish:gitlab:
  extends: .corretto
  image: amazoncorretto:21
  stage: publish
  script:
    - ./gradlew publishAllPublicationsToGitLabRepository -PjobToken=$CI_JOB_TOKEN -Prelease=true
  cache:
    <<: *cachedefinition
    policy: pull
  rules:
    - if: '$CI_COMMIT_TAG != null'

.ctantemplate: &ctandefinition
  stage: publish
  image: nixpkgs/nix-flakes:latest-x86_64-linux
  script:
    - nix develop -c ./gradlew -Prelease=$PRELEASE assembleCTAN --info
    - cp build/*.zip ./
  artifacts:
    name: "$CI_COMMIT_REF_NAME-ctan"
    paths:
      - ./*.zip
      - docs/*.pdf
    expire_in: 1 week
  cache:
    <<: *cachedefinition
    policy: pull

publish:snapshot_tdszip:
  needs:
    - build:linux:jdk21
    - test:linux:jdk21
    - test:linux:jdk25
    - test:process-smoke
    - job: pages:for-manual
      artifacts: true
  variables:
    PRELEASE: "false"
  <<: *ctandefinition
  rules:
    - if: '$CI_COMMIT_TAG == null && $CI_MERGE_REQUEST_ID == null && $CI_COMMIT_REF_NAME == "development"'
    - if: '$CI_COMMIT_TAG == null && $CI_MERGE_REQUEST_ID == null && $CI_COMMIT_REF_NAME == "master"'

publish:tdszip:
  variables:
    PRELEASE: "true"
  <<: *ctandefinition
  rules:
    - if: '$CI_COMMIT_TAG != null'
