GermanLanguage.ERROR_DIALOG_INPUT_CLOSED=Es scheint, als sei die Terminaleingabe beendet worden, während ein Dialog auf eine Antwort wartete, daher kann ich Ihre Auswahl nicht lesen. Bitte führe arara in einem interaktiven Terminal aus, damit der Dialog beantwortet werden kann.
GermanLanguage.ERROR_DIALOGS_NOT_CONFIGURED=Es scheint, als sei für diese Ausführung keine Dialogunterstützung konfiguriert, daher kann ich den von einer Regel angeforderten Dialog nicht anzeigen. Bitte stelle eine Dialog-Implementierung in der Anwendung bereit, die arara ausführt, oder vermeide Regeln mit interaktiven Dialogen.
