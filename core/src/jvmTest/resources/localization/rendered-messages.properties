ItalianLanguage.ERROR_LUA_UNTERMINATED_QUOTE=Stringa tra virgolette non terminata nel tag di interpolazione.
ItalianLanguage.ERROR_LUA_UNTERMINATED_LONG_STRING=Stringa lunga non terminata nel tag di interpolazione.
ItalianLanguage.ERROR_LUA_MAP_KEYS=Le chiavi della mappa coincidono come stringhe Lua.
