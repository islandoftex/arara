ItalianLanguage.ERROR_PROJECT_CYCLE=Le dipendenze dei progetti contengono un ciclo: marker-1-$-\\-%s.
ItalianLanguage.ERROR_PROJECT_FILE_OWNERSHIP=Il file 'marker-1-$-\\-%s' appartiene sia a 'marker-2-$-\\-%s' che a 'marker-3-$-\\-%s'.
