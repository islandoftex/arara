DutchLanguage.ERROR_DIALOG_INPUT_CLOSED=Het lijkt erop dat de terminalinvoer is beëindigd terwijl een dialoog op een antwoord wachtte, dus ik kan je keuze niet lezen. Voer arara uit in een interactieve terminal, zodat de dialoog beantwoord kan worden.
DutchLanguage.ERROR_DIALOGS_NOT_CONFIGURED=Het lijkt erop dat er voor deze uitvoering geen dialoogondersteuning is geconfigureerd, dus ik kan de dialoog die een regel vroeg niet tonen. Geef een dialoogimplementatie op in de toepassing die arara uitvoert, of vermijd regels met interactieve dialogen.
DutchLanguage.ERROR_SCRIPT_STRING=marker-1-$-\\-%s moet een tekenreeks zijn.
DutchLanguage.ERROR_SCRIPT_TABLE=marker-1-$-\\-%s moet een tabel zijn.
DutchLanguage.ERROR_SCRIPT_BOOLEAN=marker-1-$-\\-%s moet een booleaanse waarde zijn.
DutchLanguage.ERROR_SCRIPT_INTEGER=marker-1-$-\\-%s moet een geheel getal zijn.
DutchLanguage.ERROR_SCRIPT_LIST=marker-1-$-\\-%s moet een lijst met opeenvolgende indices vanaf één zijn.
DutchLanguage.ERROR_SCRIPT_UNKNOWN_KEY=Onbekende sleutel marker-1-$-\\-%s.
DutchLanguage.ERROR_SCRIPT_REQUIRED=marker-1-$-\\-%s is verplicht.
DutchLanguage.ERROR_SCRIPT_NONBLANK=marker-1-$-\\-%s mag niet leeg zijn.
DutchLanguage.ERROR_SCRIPT_DUPLICATE=marker-1-$-\\-%s herhaalt 'marker-2-$-\\-%s'.
DutchLanguage.ERROR_SCRIPT_DIRECTORY=marker-1-$-\\-%s is een map.
DutchLanguage.ERROR_SCRIPT_EMPTY=marker-1-$-\\-%s moet minstens één item bevatten.
DutchLanguage.ERROR_SCRIPT_STRING_KEYS=marker-1-$-\\-%s vereist niet-lege tekenreeksen als sleutels.
DutchLanguage.ERROR_PROJECT_INVALID_LUA=Ongeldige Lua in marker-1-$-\\-%s: marker-2-$-\\-%s
DutchLanguage.ERROR_PROJECT_DUPLICATE_NAMES=Projectnamen moeten uniek zijn: marker-1-$-\\-%s.
DutchLanguage.ERROR_PROJECT_UNKNOWN_DEPENDENCY=Project 'marker-1-$-\\-%s' heeft een onbekende afhankelijkheid 'marker-2-$-\\-%s'.
DutchLanguage.ERROR_PROJECT_CYCLE=De projectafhankelijkheden bevatten een cyclus: marker-1-$-\\-%s.
DutchLanguage.ERROR_PROJECT_FILE_OWNERSHIP=Bestand 'marker-1-$-\\-%s' behoort tot zowel 'marker-2-$-\\-%s' als 'marker-3-$-\\-%s'.
DutchLanguage.ERROR_PROJECT_FILETYPE=Geen ingesteld bestandstype past bij 'marker-1-$-\\-%s'.
DutchLanguage.ERROR_CONFIGURATION_PREPEND=Ongeldige preamble.prepend 'marker-1-$-\\-%s'; gebruik 'always' of 'without-directives'.
DutchLanguage.ERROR_SCRIPT_FUNCTION=marker-1-$-\\-%s moet een functie zijn.
DutchLanguage.ERROR_SCRIPT_LITERAL=marker-1-$-\\-%s moet een letterlijke waarde zijn.
DutchLanguage.ERROR_SCRIPT_ALTERNATIVES=marker-1-$-\\-%s vereist minstens één van marker-2-$-\\-%s.
DutchLanguage.ERROR_LUA_INTERPOLATION_FAILURE=Het veld 'options' bevat een ongeldige Lua-expressie of interpolatietag.
DutchLanguage.ERROR_YAML_TAGS_IN_LUA=MVEL-tags vereisen de YAML-engine; Lua gebruikt {{ expression }}.
DutchLanguage.ERROR_LUA_TAGS_IN_YAML=Lua-tags vereisen --engine lua.
DutchLanguage.ERROR_LUA_UNTERMINATED_TAG=Niet-afgesloten interpolatietag.
DutchLanguage.ERROR_LUA_UNTERMINATED_QUOTE=Niet-afgesloten tekenreeks tussen aanhalingstekens in interpolatietag.
DutchLanguage.ERROR_LUA_UNTERMINATED_LONG_STRING=Niet-afgesloten lange tekenreeks in interpolatietag.
DutchLanguage.ERROR_LUA_MAP_KEYS=Mapsleutels vallen samen als Lua-tekenreeksen.
DutchLanguage.ERROR_LUA_TABLE_KEYS=Lua-tabelsleutels vallen samen als tekenreeksen.
DutchLanguage.ERROR_LUA_EXACT_INTEGER=Geheel getal marker-1-$-\\-%s kan niet exact als Lua-getal worden weergegeven.
DutchLanguage.ERROR_LUA_CYCLIC_VALUES=Cyclische tabellen en verzamelingen kunnen niet worden geconverteerd.
DutchLanguage.ERROR_LUA_BAD_ARGUMENT=ongeldig argument nr. marker-1-$-\\-%s voor 'marker-2-$-\\-%s' (marker-3-$-\\-%s verwacht, marker-4-$-\\-%s gekregen)
DutchLanguage.ERROR_LUA_BOOLEAN_RESULT=ongeldig resultaat van 'marker-1-$-\\-%s' (boolean verwacht, marker-2-$-\\-%s gekregen)
DutchLanguage.ERROR_LUA_HELPER_NO_ARGS=marker-1-$-\\-%s vereist minstens één argument.
DutchLanguage.ERROR_LOAD_COULD_NOT_LOAD_DATABASE=Database 'marker-1-$-\\-%s' kon niet worden geladen. Controleer bestandstoegang en de inhoud van de YAML-cache.
DutchLanguage.ERROR_SAVE_COULD_NOT_SAVE_DATABASE=Database 'marker-1-$-\\-%s' kon niet worden opgeslagen. Controleer of de bovenliggende map bestaat en schrijfbaar is.
DutchLanguage.ERROR_BASENAME_NOT_A_FILE=De 'basename'-methode vereist een bestand, geen directory. Het lijkt erop dat 'marker-1-$-\\-%s' geen bestand is. Als je taken wil uitvoeren met een directory kan je een aantal methodes uit de Java API gebruiken.
DutchLanguage.ERROR_CALCULATEHASH_IO_EXCEPTION=Om een of andere reden kan ik de hash niet berekenen. Ik weet niet waarom het precies fout ging. Misschien is het bestand verplaatst of verwijderd voor of tijdens de hashing, of misschien heb ik niet de juiste rechten om het bestand te lezen.
DutchLanguage.ERROR_CHECKBOOLEAN_NOT_VALID_BOOLEAN=Het lijkt erop dat 'marker-1-$-\\-%s' geen boolean-waarde is. Dit zou makkelijk op te lossen moeten zijn. Gebruik een geldige representatie voor een boolean (yes en no, true en false, 1 en 0, on en off).
DutchLanguage.ERROR_CHECKREGEX_IO_EXCEPTION=Ik kon de inhoud van het bestand 'marker-1-$-\\-%s' niet lezen vanwege een IO-fout. Ik weet niet waarom het precies fout ging. Misschien is het bestand verplaatst of verwijderd voor of tijdens de leesoperatie, of misschien heb ik niet de juiste rechten om het bestand te lezen.
DutchLanguage.ERROR_CONFIGURATION_GENERIC_ERROR=Ik kon het configuratiebestand niet verwerken, er is iets verkeerd gegaan. Dit probleem is ingewikkeld, omdat het te maken heeft met aspecten van de onderliggende serialisatiesyntax. Ik zal mijn best doen om je zoveel mogelijk hiermee te helpen.
DutchLanguage.ERROR_CONFIGURATION_LOOPS_INVALID_RANGE=De waarde gedefinieerd in de 'loops'-optie in het configuratiebestand om het maximumaantal herhalingen te specificeren heeft een ongeldig bereik. Geef alsjeblieft een positieve long integer-waarde op.
DutchLanguage.ERROR_DISCOVERFILE_FILE_NOT_FOUND=Ik kon het opgegeven bestand 'marker-1-$-\\-%s' marker-2-$-\\-%s niet vinden. Zorg ervoor dat het bestand bestaat en dat het een geldige extensie heeft.
DutchLanguage.ERROR_EVALUATE_COMPILATION_FAILED=Om een of andere reden kon ik de expressie in de opgegeven voorwaarde niet compileren. Dit is een ingewikkeld probleem, omdat het te maken heeft met aspecten van de onderliggende expressietaal. Ik zal mijn best doen om je zoveel mogelijk hiermee te helpen.
DutchLanguage.ERROR_EVALUATE_NOT_BOOLEAN_VALUE=De evaluatie van de voorwaarde verwachtte een boolean als resultaat. Dit zou makkelijk op te lossen moeten zijn. Zorg ervoor dat de evaluatie uiteindelijk een boolean oplevert.
DutchLanguage.ERROR_EXTRACTOR_IO_ERROR=Er was een IO-probleem bij het verwerken van de directives. Ik weet niet waarom het precies fout ging. Misschien is het bestand verplaatst of verwijderd voor of tijdens het hashen, of misschien heb ik niet de juiste rechten om het bestand te lezen.
DutchLanguage.ERROR_EXTRACTOR_INTERPOLATION_FAILURE=Uw 'opties'-veld bevat een item dat de MVEL-parser niet aankan. Herzie alstublieft uw opties, zodat deze geen foutieve '@ {…}' onderdelen meer bevatten.
DutchLanguage.ERROR_FILETYPE_INVALID_PATTERN=Het lijkt erop dat het patroon "marker-1-$-\\-%s" dat je voor dit bestandstype wilde gebruiken geen geldige reguliere expressie is. Dit zou makkelijk op te lossen moeten zijn: zorg dat je een geldige expressie gebruikt en probeer het opnieuw.
DutchLanguage.ERROR_FILETYPE_NOT_A_FILE=De 'filetype'-methode vereist een bestand, geen directory. Het lijkt erop dat 'marker-1-$-\\-%s' geen bestand is. Als je taken wil uitvoeren met een directory kan je een aantal methodes uit de Java API gebruiken.
DutchLanguage.ERROR_FILETYPE_UNKNOWN_EXTENSION=De extensie 'marker-1-$-\\-%s' is niet herkend als een standaardextensie. Als je een nieuw bestandstype wil definiëren zorg dan dat de extensie en het patroon zijn opgegeven. De volgende extensies zijn standaard: marker-2-$-\\-%s
DutchLanguage.ERROR_GETAPPLICATIONPATH_ENCODING_EXCEPTION=Er was een coderingsprobleem bij het verkrijgen van het applicatiepad. Daar kan ik niet zo veel aan doen.
DutchLanguage.ERROR_INTERPRETER_ARGUMENT_IS_REQUIRED=Het argument 'marker-1-$-\\-%s' is gemarkeerd als verplicht in de regel, maar ik kon het niet vinden in de parameters van de directive. Zorg ervoor dat het als parameter voor de directive wordt toegevoegd en probeer het opnieuw.
DutchLanguage.ERROR_INTERPRETER_COMMAND_RUNTIME_ERROR=Ik kon een van de opgegeven opdrachten niet evalueren. Dit is een ingewikkeld probleem, omdat het te maken heeft met aspecten van de onderliggende expressietaal. Ik zal mijn best doen om je zoveel mogelijk hiermee te helpen.
DutchLanguage.ERROR_INTERPRETER_COMMAND_UNSUCCESSFUL_EXIT=Het commando "marker-1-$-\\-%s" is onverwacht beëindigd met een afsluitwaarde die niet gelijk is aan nul. Bekijk het resultaat van het commando en anaylseer het om uw volgende stappen te bepalen.
DutchLanguage.ERROR_INTERPRETER_USER_REQUESTED_HALT=arara word nu beëindigd op uw (of een regel) verzoek.
DutchLanguage.ERROR_INTERPRETER_EXIT_RUNTIME_ERROR=Ik kon de exitwaardemelding van een van de opgegeven opdrachten niet evalueren. Dit is een ingewikkeld probleem, omdat het te maken heeft met aspecten van de onderliggende expressietaal. Ik zal mijn best doen om je zoveel mogelijk hiermee te helpen.
DutchLanguage.ERROR_INTERPRETER_FLAG_RUNTIME_EXCEPTION=Ik kon de optie-expressie van een van de argumenten niet evalueren. Dit is een ingewikkeld probleem, omdat het te maken heeft met aspecten van de onderliggende expressietaal. Ik zal mijn best doen om je zoveel mogelijk hiermee te helpen.
DutchLanguage.ERROR_LOG_FORMAT_UNKNOWN=Onbekend logformaat 'marker-1-$-\\-%s'. Gebruik none, text of json.
DutchLanguage.ERROR_CONSOLE_MODE_UNKNOWN=Onbekende consolemodus 'marker-1-$-\\-%s'. Gebruik plain of styled.
DutchLanguage.ERROR_PARSE_RULE_UNSUPPORTED_FORMAT=Niet-ondersteund regelformaat voor 'marker-1-$-\\-%s': 'marker-2-$-\\-%s'. Gebruik een YAML- of Lua-regelbestand.
DutchLanguage.ERROR_INTERPRETER_RULE_NOT_FOUND=Ik kon de regel met de naam 'marker-1-$-\\-%s' niet vinden in de opgegeven regelpaden. Misschien een spelfout? Ik heb geprobeerd het bestand 'marker-2-$-\\-%s' te vinden in de volgende paden in volgorde van prioriteit: marker-3-$-\\-%s
DutchLanguage.ERROR_INTERPRETER_UNKNOWN_KEYS=Ik heb de volgende onbekende verwijzingen gevonden in de directive: marker-1-$-\\-%s. Dit zou makkelijk op te lossen moeten zijn: verwijder deze uit de verwijzingstabel.
DutchLanguage.ERROR_INTERPRETER_WRONG_EXIT_CLOSURE_RETURN=De 'exit'-expressie moet altijd een boolean waarde teruggeven (zelfs als er geen berekening heeft plaatsgevonden). Dit zou makkelijk op te lossen moeten zijn: pas het type van de return-regel aan en probeer het opnieuw.
DutchLanguage.ERROR_INTERPRETER_WRONG_RETURN_TYPE=Een regel mag alleen een, waar of niet waar (booleaanse waarde), of een commando als uitkomst hebben. Andere enter types worden niet ondersteund.
DutchLanguage.ERROR_INVALID_PROJECT_FILE=I have read a file that was supposed to be a project. Unfortunately, it turned out it was neither a project nor a list of projects. Please double-check that your project file follows the documented format.
DutchLanguage.ERROR_LOAD_COULD_NOT_LOAD_XML=Ik kon de YAML-database met de naam 'marker-1-$-\\-%s' niet laden. Ik weet niet waarom het precies fout ging. Misschien was het bestand verplaatst of verwijderd tijdens de leesoperatie. Of misschien heb ik niet de juiste rechten om het bestand te lezen. Overigens: zorg ervoor dat het YAML-bestand welgevormd is.
DutchLanguage.ERROR_PARSER_INVALID_PREAMBLE=Het spijt me, maar de preamble 'marker-1-$-\\-%s' is niet gevonden. Zorg ervoor dat deze verwijzing bestaat in het configuratiebestand.
DutchLanguage.ERROR_PARSERULE_GENERIC_ERROR=Ik kon de regel niet verwerken, er is iets verkeerd gegaan. Dit probleem is ingewikkeld, omdat het te maken heeft met aspecten van de onderliggende dataserialisatiesyntax. Ik zal mijn best doen om je zoveel mogelijk hiermee te helpen.
DutchLanguage.ERROR_REPLICATELIST_MISSING_FORMAT_ARGUMENTS_EXCEPTION=Ik kon de lijst niet genereren vanwege een ontbrekend format-argument. Ik denk dat er minder (of meer) parameters zijn dan verwacht. Geef het juiste aantal argumenten op en probeer het opnieuw.
DutchLanguage.ERROR_RULE_IDENTIFIER_AND_PATH=Ik heb een fout gevonden in regel 'marker-1-$-\\-%s' op positie 'marker-2-$-\\-%s'.
DutchLanguage.ERROR_RUN_GENERIC_EXCEPTION=Ik kon het opgegeven systeemcommando niet uitvoeren, er is iets misgegaan. Dit is een ingewikkeld probleem, omdat het te maken heeft met aspecten van de onderliggende expressietaal. Ik zal mijn best doen om je zoveel mogelijk hiermee te helpen.
DutchLanguage.ERROR_RUN_INTERRUPTED_EXCEPTION=Het uitvoeren van het opgegeven systeemcommando is onverwacht onderbroken. Misschien was er een externe onderbreking die ervoor gezorgd heeft dat het commando gestopt is.
DutchLanguage.ERROR_RUN_INVALID_EXIT_VALUE_EXCEPTION=Het opgegeven systeemcommando heeft een ongeldige exit-waarde teruggegeven.
DutchLanguage.ERROR_RUN_IO_EXCEPTION=Het uitvoeren van het systeemcommando is mislukt vanwege een IO-fout. Weet je zeker dat het commando bestaat in het pad? Het is misschien een goed idee om het pad te controleren en te kijken of het commando beschikbaar is.
DutchLanguage.ERROR_RUN_TIMEOUT_EXCEPTION=Het uitvoeren van het systeemcommando is onderbroken omdat de maximale uitvoeringsduur overschreden is. Als de tijd te kort was, pas dan de maximale uitvoeringsduur aan.
DutchLanguage.ERROR_SAVE_COULD_NOT_SAVE_XML=Ik kon de YAML-database met de naam 'marker-1-$-\\-%s' niet opslaan. Ik weet niet precies waarom het fout ging. Misschien heb ik niet de juiste schrijfrechten om het YAML-bestand op te slaan.
DutchLanguage.ERROR_SESSION_OBTAIN_UNKNOWN_KEY=De 'get'-methode heeft een onbekende verwijzing gevonden in de sessie: 'marker-1-$-\\-%s'. Als ik iets niet heb kan ik het ook niet gebruiken. Geef een bestaande verwijzing op en probeer het opnieuw.
