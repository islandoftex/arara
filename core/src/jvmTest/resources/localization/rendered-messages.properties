Messages.ERROR_CHECKBOOLEAN_NOT_VALID_BOOLEAN=It looks like "marker-1-$-\\-%s" is not a valid boolean value. This should be an easy fix. Make sure to use a valid string that represents boolean values (yes and no, true and false, 1 and 0, and on and off).
