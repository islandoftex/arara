ItalianLanguage.ERROR_LUA_EXACT_INTEGER=Il numero intero marker-1-$-\\-%s non può essere rappresentato esattamente come numero Lua.
ItalianLanguage.ERROR_LUA_CYCLIC_VALUES=Le tabelle e le collezioni cicliche non possono essere convertite.
ItalianLanguage.ERROR_LUA_BAD_ARGUMENT=argomento n. marker-1-$-\\-%s non valido per 'marker-2-$-\\-%s' (atteso marker-3-$-\\-%s, ricevuto marker-4-$-\\-%s)
ItalianLanguage.ERROR_LUA_BOOLEAN_RESULT=risultato non valido da 'marker-1-$-\\-%s' (atteso boolean, ricevuto marker-2-$-\\-%s)
ItalianLanguage.ERROR_LUA_HELPER_NO_ARGS=marker-1-$-\\-%s richiede almeno un argomento.
ItalianLanguage.ERROR_LOAD_COULD_NOT_LOAD_DATABASE=Impossibile caricare il database 'marker-1-$-\\-%s'. Verificare l'accesso al file e l'integrità della cache YAML.
ItalianLanguage.ERROR_SAVE_COULD_NOT_SAVE_DATABASE=Impossibile salvare il database 'marker-1-$-\\-%s'. Verificare che la cartella esista e sia scrivibile.
ItalianLanguage.ERROR_BASENAME_NOT_A_FILE=Il metodo 'basename' richiede un file, non una directory. 'marker-1-$-\\-%s' non sembra proprio essere un file. Se devi eseguire un compito su una directory, puoi adoperare uno dei metodi delle API Java.
ItalianLanguage.ERROR_CALCULATEHASH_IO_EXCEPTION=Per qualche motivo, non ho potuto calcolare un hash. Purtroppo non ho idea del perché sia andata male. Forse il file è stato spostato o cancellato durante l'operazione di hashing. O forse non ho i permessi necessari per leggere il file.
ItalianLanguage.ERROR_CHECKBOOLEAN_NOT_VALID_BOOLEAN=Sembra che 'marker-1-$-\\-%s' non sia un valore booleano valido. Penso che sia facile correggerlo. Assicurati di adoperare una stringa valida che rappresenti un valore booleano (yes e no, true e false, 1 e 0, oppure on e off).
ItalianLanguage.ERROR_CHECKREGEX_IO_EXCEPTION=Non sono riuscito a leggere il contenuto del file 'marker-1-$-\\-%s' e ho ricevuto in errore di I/O. Purtroppo non ho idea del perché sia andata male. Forse il file è stato spostato o cancellato durante l'operazione di hashing. O forse non ho i permessi necessari per leggere il file.
ItalianLanguage.ERROR_CONFIGURATION_GENERIC_ERROR=Non sono riuscito a leggere il file di configurazione, è successo qualcosa che non va. Questa parte è un po' complicata, perché riguarda aspetti del formato interno di serializzazione dei dati. Farò del mio meglio per darti una mano, per quanto posso.
ItalianLanguage.ERROR_CONFIGURATION_LOOPS_INVALID_RANGE=Il valore definito nella chiave 'loops' del file di configurazione per stabilire il massimo numero di cicli ha un intervallo non valido. Assicurati che sia un valore 'lungo' e positivo.
ItalianLanguage.ERROR_DISCOVERFILE_FILE_NOT_FOUND=Non sono riuscito a trovare il file 'marker-1-$-\\-%s' marker-2-$-\\-%s. Assicurati che il file esista e abbia un'estensione valida.
ItalianLanguage.ERROR_EVALUATE_COMPILATION_FAILED=Per qualche ragione, non sono riuscito a compilare l'espressione del condizionale fornito. Questa parte è un po' complicata, perché riguarda aspetti del linguaggio interno per le espressioni. Farò del mio meglio per darti una mano, per quanto posso.
ItalianLanguage.ERROR_EVALUATE_NOT_BOOLEAN_VALUE=La valutazione del condizionale si aspettava un valore booleano come risultato. Dovrebbe essere facile correggerlo. Assicurati che la valutazione del condizionale fornisca alla fine un valore booleano.
ItalianLanguage.ERROR_EXTRACTOR_IO_ERROR=C'è stato un errore di I/O mentre provavo a estrarre le direttive. Purtroppo non ho idea del perché sia andata male. Forse il file è stato spostato o cancellato prima o durante l'operazione di hashing. O forse non ho i permessi necessari per leggere il file.
ItalianLanguage.ERROR_EXTRACTOR_INTERPOLATION_FAILURE=Il campo 'options' ha un contenuto che il parser MVEL non riesce a gestire. Correggi le opzioni in modo che non contengano parti di forma scorretta con '@{...}'.
ItalianLanguage.ERROR_FILETYPE_INVALID_PATTERN=Sembra che il pattern "marker-1-$-\\-%s" che volevi usare per questo tipo di file non sia un'espressione regolare valida. Dovrebbe essere facile da sistemare: assicurati di usare un'espressione valida e riprova.
ItalianLanguage.ERROR_FILETYPE_NOT_A_FILE=Il metodo 'filetype' richiede un file, non una directory. 'marker-1-$-\\-%s' non sembra proprio essere un file. Se devi eseguire un compito su una directory, puoi adoperare uno dei metodi delle API Java.
ItalianLanguage.ERROR_FILETYPE_UNKNOWN_EXTENSION=Non riconosco 'marker-1-$-\\-%s' come un'estensione standard. Se vuoi definire un nuovo tipo di file, assicurati di fornire l'estensione e lo schema. Queste sono le estensioni standard: marker-2-$-\\-%s
ItalianLanguage.ERROR_GETAPPLICATIONPATH_ENCODING_EXCEPTION=C'è stato un problema di codifica mentre tentavo di ottenere il percorso dell'applicazione. Non c'è molto che possa fare al riguardo.
ItalianLanguage.ERROR_INTERPRETER_ARGUMENT_IS_REQUIRED=Sembra che 'marker-1-$-\\-%s' sia contrassegnato come obbligatorio nella regola, ma non l'ho trovato nei parametri della direttiva. Assicurati di aggiungerlo come parametro nella direttiva e riprova.
ItalianLanguage.ERROR_INTERPRETER_COMMAND_RUNTIME_ERROR=Non ho potuto valutare uno dei comandi forniti. Questa parte è un po' complicata perché coinvolge aspetti del linguaggio per le espressioni sottostante. Farò del mio meglio per darti una mano, per quanto posso.
ItalianLanguage.ERROR_INTERPRETER_COMMAND_UNSUCCESSFUL_EXIT=Il comando "marker-1-$-\\-%s" ha dato un esito inaspettato, con codice di ritorno non a zero. Guarda l'output per valutare le eventuali azioni da intraprendere.
ItalianLanguage.ERROR_INTERPRETER_USER_REQUESTED_HALT=A seguito di una tua richiesta (o di una regola), arara ora interromperà l'esecuzione.
ItalianLanguage.ERROR_INTERPRETER_EXIT_RUNTIME_ERROR=Non sono riuscito a valutare lo stato di uscita di uno dei comandi forniti. Questa parte è un po' complicata perché coinvolge aspetti del linguaggio per le espressioni sottostante. Farò del mio meglio per darti una mano, per quanto posso.
ItalianLanguage.ERROR_INTERPRETER_FLAG_RUNTIME_EXCEPTION=Non ho potuto valutare la flag di uno degli argomenti. Questa parte è un po' complicata perché coinvolge aspetti del linguaggio per le espressioni sottostante. Farò del mio meglio per darti una mano, per quanto posso.
ItalianLanguage.ERROR_LOG_FORMAT_UNKNOWN=Formato di log sconosciuto 'marker-1-$-\\-%s'. Usare none, text o json.
ItalianLanguage.ERROR_CONSOLE_MODE_UNKNOWN=Modalità console sconosciuta 'marker-1-$-\\-%s'. Usare plain o styled.
ItalianLanguage.ERROR_PARSE_RULE_UNSUPPORTED_FORMAT=Formato di regola non supportato per 'marker-1-$-\\-%s': 'marker-2-$-\\-%s'. Usare un file di regola YAML o Lua.
ItalianLanguage.ERROR_INTERPRETER_RULE_NOT_FOUND=Non sono riuscito a trovare una regola chiamata 'marker-1-$-\\-%s' nei percorsi per le regole impostati. Forse una parola scritta sbagliata? Stavo cercando un file con il nome 'marker-2-$-\\-%s' nei seguenti percorsi in ordine di priorità: marker-3-$-\\-%s
ItalianLanguage.ERROR_INTERPRETER_UNKNOWN_KEYS=Ho trovato queste chiavi sconosciute nella direttiva: marker-1-$-\\-%s. Dovrebbbe essere facile correggere, toglile dalla mappa.
ItalianLanguage.ERROR_INTERPRETER_WRONG_EXIT_CLOSURE_RETURN=L'espressione di 'uscita' deve essere sempre un valore booleano (anche se non c'è alcun calcolo nella parte di chiusura). Dovrebbe essere facile correggere: assicurati che l'asserzione del 'type return' sia giusta e riprova.
ItalianLanguage.ERROR_INTERPRETER_WRONG_RETURN_TYPE=Una regola dovrebbe restituire solo un booleano o un comando. Altri tipi di risposta non sono supportati.
ItalianLanguage.ERROR_INVALID_PROJECT_FILE=I have read a file that was supposed to be a project. Unfortunately, it turned out it was neither a project nor a list of projects. Please double-check that your project file follows the documented format.
ItalianLanguage.ERROR_LOAD_COULD_NOT_LOAD_XML=Non ho potuto caricare il database YAML di nome 'marker-1-$-\\-%s'. Purtroppo non ho idea del perché sia andata male. Forse il file è stato spostato o cancellato prima o durante l'operazione di lettura. O forse non ho i permessi necessari per leggere il file. Già che ci siamo, assicurati che il file YAML sia ben formato.
ItalianLanguage.ERROR_PARSER_INVALID_PREAMBLE=Mi dispiace, ma non è stato possibile trovare il preambolo 'marker-1-$-\\-%s'. Assicurati che questa chiave esista nel file di configurazione.
ItalianLanguage.ERROR_PARSERULE_GENERIC_ERROR=Non ho potuto analizzare la regola, qualcosa è andato storto. Questa parte è un po' complicata, perché riguarda aspetti del formato interno di serializzazione dei dati. Farò del mio meglio per darti una mano, per quanto posso.
ItalianLanguage.ERROR_REPLICATELIST_MISSING_FORMAT_ARGUMENTS_EXCEPTION=Non sono riuscito a replicare la lista perché manca un argomento per il formato. Penso che si tratti di un numero sbagliato di parametri. Assicurati che il numero di parametri sia corretto e riprova.
ItalianLanguage.ERROR_RULE_IDENTIFIER_AND_PATH=Ho trovato un errore nella regola 'marker-1-$-\\-%s' alla posizione 'marker-2-$-\\-%s'.
ItalianLanguage.ERROR_RUN_GENERIC_EXCEPTION=Non ho potuto lanciare il comando di sistema richiesto, qualcosa è andato storto. Questa parte è un po' complicata, perché riguarda aspetti del linguaggio interno per le espressioni. Farò del mio meglio per darti una mano, per quanto posso.
ItalianLanguage.ERROR_RUN_INTERRUPTED_EXCEPTION=L'esecuzione del comando di sistema richiesto si è interrotta inaspettatamente. Forse un'interruzione esterna ha forzato il comando a terminare.
ItalianLanguage.ERROR_RUN_INVALID_EXIT_VALUE_EXCEPTION=Il comando di sistema richiesto ha restituito un valore di uscita non valido.
ItalianLanguage.ERROR_RUN_IO_EXCEPTION=L'esecuzione del comando di sistema è fallita per via di un errore di I/O. Sei sicuro che il programma esista nei tuoi percorsi? Meglio controllare se il programma è davvero disponibile.
ItalianLanguage.ERROR_RUN_TIMEOUT_EXCEPTION=L'esecuzione del comando di sistema ha raggiunto il valore di timeout impostato ed è stata interrotta. Se il tempo è troppo breve, assicurati di impostarne uno più lungo.
ItalianLanguage.ERROR_SAVE_COULD_NOT_SAVE_XML=Non ho potuto salvare il database YAML con il nome 'marker-1-$-\\-%s'. Purtroppo non ho idea del perché sia successo. Forse non ho i permessi appropriati per scrivere il file YAML sul disco.
ItalianLanguage.ERROR_SESSION_OBTAIN_UNKNOWN_KEY=Il metodo 'get' ha trovato una chiave sconosciuta 'marker-1-$-\\-%s' nell'ambito della sessione. Non posso ottenere qualcosa che non ho da nessuna parte. Specifica una chiave valida e riprova.
ItalianLanguage.ERROR_SESSION_REMOVE_UNKNOWN_KEY=Il metodo 'remove' ha trovato una chiave sconosciuta 'marker-1-$-\\-%s' nell'ambito della sessione. Non posso ottenere qualcosa che non ho da nessuna parte. Specifica una chiave valida e riprova.
ItalianLanguage.ERROR_VALIDATE_EMPTY_FILES_LIST=Ho letto la direttiva marker-1-$-\\-%s, ma la lista 'files' fornita è vuota. Puoi correggerlo facilmente assicurandoti che la lista abbia almeno un elemento, poi riprova.
ItalianLanguage.ERROR_VALIDATE_FILES_IS_NOT_A_LIST=Ho letto la direttiva marker-1-$-\\-%s e ho scoperto che 'files' richiede una lista. Assicurati di correggere il tipo a una lista appropriata e riprova.
ItalianLanguage.ERROR_VALIDATE_INVALID_DIRECTIVE_FORMAT=Ho visto nel file fornito la direttiva marker-1-$-\\-%s che non è valida. Assicurati di correggere la direttiva e riprova.
ItalianLanguage.ERROR_VALIDATE_NO_DIRECTIVES_FOUND=Sembra che nel file fornito non ci siano direttive. Assicurati che ce ne sia almeno una e riprova.
ItalianLanguage.ERROR_VALIDATE_ORPHAN_LINEBREAK=Sembra che ci sia un fine riga che lascia orfana una direttiva alla riga marker-1-$-\\-%s. Non posso andare avanti. Correggi la direttiva e riprova.
ItalianLanguage.ERROR_VALIDATE_REFERENCE_IS_RESERVED=Ho letto la direttiva marker-1-$-\\-%s dove è stata usata la chiave 'reference'. Questa chiave è riservata e non puoi usarla. Non preoccuparti, lo metti facilmente a posto dando un altro nome.
ItalianLanguage.ERROR_VALIDATE_YAML_EXCEPTION=C'è stato un problema con la mappa YAML fornita con la direttiva marker-1-$-\\-%s. Questa parte è un po' complicata, perché riguarda aspetti del formato interno di serializzazione dei dati. Farò del mio meglio per darti una mano, per quanto posso.
ItalianLanguage.ERROR_VALIDATEBODY_ARGUMENT_ID_IS_RESERVED=L'identificatore dell'argomento 'marker-1-$-\\-%s' è riservato, quindi non puoi adoperarlo. È facile correggerlo: chiamalo in modo diverso.
ItalianLanguage.ERROR_VALIDATEBODY_DUPLICATE_ARGUMENT_IDENTIFIERS=Sembra che tu abbia identificatori di argomenti duplicati nella tua regola. Correggi e riprova.
ItalianLanguage.ERROR_VALIDATEBODY_MISSING_KEYS=Quando si definisce un ambito per l'argomento in una regola bisogna adoperare almeno 'flag' o 'default'. Assicurati che ci sia uno di questi.
ItalianLanguage.ERROR_VALIDATEBODY_NULL_ARGUMENT_ID=Ho trovato che uno degli argomenti non ha identificatore. Assicurati di assegnare un identificatore all'argomento e riprova.
ItalianLanguage.ERROR_VALIDATEBODY_NULL_COMMAND=Ho trovato un comando 'nullo' nella regola fornita. Dovrebbe essere facile correggere: aggiungi un comando valido alla regola.
ItalianLanguage.ERROR_VALIDATEHEADER_NULL_NAME=La regola fornita non ha nome. È facile correggere: specifica un nome valido e riprova.
ItalianLanguage.ERROR_VALIDATEHEADER_WRONG_IDENTIFIER=La regola ha un identificatore sbagliato. Mi sarei aspettato 'marker-1-$-\\-%s', ma ho trovato 'marker-2-$-\\-%s'. È facile correggere: correggi l'identificatore sbagliato con quello giusto.
ItalianLanguage.INFO_CONSOLE_SKIPPED=Saltata
ItalianLanguage.INFO_CONSOLE_UNPROCESSED=Non elaborato
ItalianLanguage.INFO_DISPLAY_EXCEPTION_MORE_DETAILS=Ci sono altri dettagli riguardo a questa eccezione:
ItalianLanguage.INFO_DISPLAY_EXECUTION_TIME=Totale: marker-1-$-\\-%s secondi
ItalianLanguage.INFO_DISPLAY_FILE_INFORMATION=Elaborazione 'marker-1-$-\\-%s' (totale: marker-2-$-\\-%s, modificato il: marker-3-$-\\-%s), attendere.
ItalianLanguage.INFO_INTERPRETER_DRYRUN_MODE_BOOLEAN_MODE=Sebbene stia eseguendo in modo 'dry-run', questo elemento potrebbe essere già stato elaborato, perché ha restituito un valore booleano: marker-1-$-\\-%s
