ItalianLanguage.ERROR_DIALOG_INPUT_CLOSED=Sembra che l’input del terminale si sia chiuso mentre un dialogo attendeva una risposta, quindi non posso leggere la tua scelta. Esegui arara in un terminale interattivo, così il dialogo può ricevere una risposta.
ItalianLanguage.ERROR_DIALOGS_NOT_CONFIGURED=Sembra che questa esecuzione non abbia alcun supporto per i dialoghi configurato, quindi non posso mostrare il dialogo richiesto da una regola. Fornisci un’implementazione dei dialoghi nell’applicazione che esegue arara, oppure evita regole con dialoghi interattivi.
