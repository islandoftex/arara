BrazilianLanguage.ERROR_FILETYPE_NOT_A_FILE=O método 'filetype' requer um arquivo, não um diretório. Observe que 'marker-1-$-\\-%s' não parece ser um arquivo. Se você precisa realizar alguma tarefa em um diretório, experimente os métodos disponíveis na API Java.
