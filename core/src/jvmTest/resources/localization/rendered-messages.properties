ItalianLanguage.ERROR_LUA_INTERPOLATION_FAILURE=Il campo 'options' contiene un'espressione Lua o un tag di interpolazione non valido.
ItalianLanguage.ERROR_YAML_TAGS_IN_LUA=I tag MVEL richiedono il motore YAML; Lua usa {{ expression }}.
ItalianLanguage.ERROR_LUA_TAGS_IN_YAML=I tag Lua richiedono --engine lua.
