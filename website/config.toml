# The URL the site will be built for
base_url = "https://islandoftex.gitlab.io/arara"

title = "arara"
description = "A TeX automation tool based on directives and rules."

theme = "devlab-theme"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[markdown.highlighting]
error_on_missing_language = true
light_theme = "github-light"
dark_theme = "github-dark-high-contrast"
extra_themes = ["highlight_themes/github-dark-high-contrast.json"]

[markdown]
# When set to "true", emoji aliases translated to their corresponding
# Unicode emoji equivalent in the rendered Markdown files. (e.g.: :smile: => 😄)
render_emoji = true

# Whether external links are to be opened in a new tab
# If this is true, a `rel="noopener"` will always automatically be added for security reasons
external_links_target_blank = true

# Whether to set rel="noreferrer" for all external links
external_links_no_referrer = true

[search]
index_format = "elasticlunr_javascript"

[extra.devlab.brand]
logo_text = "arara"
show_logo_mark = true
logo_mark_path = "/brand/arara-logo.svg"

[extra.devlab.appearance]
default_mode = "system"
show_toggle = true

[extra.devlab.footer]
show = true
note = "arara by the Island of TeX"
links_label = "Community"
show_link_names = true
links = [
  { name = "Island of TeX", path = "https://islandoftex.gitlab.io/", icon = "link" },
  { name = "GitLab", path = "https://gitlab.com/islandoftex/arara", icon = "gitlab" },
  { name = "Matrix", path = "https://matrix.to/#/!HfEWIEvFtDplCLSQvz:matrix.org?via=matrix.org", icon = "matrix" },
]

[extra.devlab.navigation]
links = [
  { name = "Quickstart", path = "/quickstart/" },
  { name = "Changelog", path = "/changelog/" },
  { name = "Manual", collection = "manual" },
  { name = "News", path = "/news/" },
  { name = "GitLab", path = "https://gitlab.com/islandoftex/arara" },
]

[extra.devlab.collections.manual]
section = "manual/_index.md"
show_breadcrumbs = true
show_toc = true
show_pagination = true

[extra.devlab.collections.manual.page_actions]
edit_url = "https://gitlab.com/islandoftex/arara/-/edit/development/website/content/"

[extra.devlab.home]
layout = "wide"

[[extra.devlab.home.blocks]]
type = "hero"
title = "The cool TeX automation tool"
description = "arara is a TeX automation tool based on directives and rules."
image = "/images/demonstration.gif"
image_alt = "Editing TeX directives in Emacs and running arara in an embedded terminal"
actions = [
  { label = "Get started", path = "/quickstart/" },
  { label = "Read the manual", path = "/manual/" },
]

[[extra.devlab.home.blocks]]
type = "features"
title = "Your TeX workflow, in the source"
items = [
  { title = "Directives in your document", description = "List the tasks in source comments. arara runs them in the order you specify.", path = "/manual/concepts/" },
  { title = "YAML and Lua rules", description = "Use the supplied rules or write your own. Choose YAML/MVEL or Lua for your workflow.", path = "/manual/rules/" },
  { title = "Plain or styled output", description = "Keep the classic console layout or select colored task results, dialogs and a run summary.", path = "/manual/cli/" },
]

[[extra.devlab.home.blocks]]
type = "learn"
title = "Learn arara"
items = [
  { title = "Quickstart", description = "Build your first document with directives.", path = "/quickstart/" },
  { title = "User manual", description = "Explore configuration, projects and rule authoring.", path = "/manual/" },
  { title = "Changelog", description = "Find changes and compatibility notes for each version.", path = "/changelog/" },
  { title = "Get in touch", description = "Ask questions and discuss arara in our Matrix room.", path = "https://matrix.to/#/!HfEWIEvFtDplCLSQvz:matrix.org?via=matrix.org" },
]

[[extra.devlab.home.blocks]]
type = "content"
title = "Overview"

[[extra.devlab.home.blocks]]
type = "cta"
title = "Get arara"
description = "Find arara in TeX Live and MiKTeX, or download it for manual installation."
actions = [
  { label = "CTAN package", path = "https://ctan.org/pkg/arara" },
  { label = "GitLab releases", path = "https://gitlab.com/islandoftex/arara/-/releases" },
]
