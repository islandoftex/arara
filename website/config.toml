# arara — the Island of TeX website
# The site inherits its URL from the previous incarnation.
base_url = "https://islandoftex.gitlab.io/arara"
title = "arara"
description = "A TeX automation tool based on directives and rules."
default_language = "en"

theme = "devlab-theme"

compile_sass = true
build_search_index = true

# The authors taxonomy: the news bylines and the author pages the
# theme renders from the data/authors.toml registry.
taxonomies = [
  { name = "authors" }
]

[search]
index_format = "elasticlunr_javascript"
include_title = true
include_description = true
include_content = true

[markdown]
insert_anchor_links = "right"

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark-high-contrast"
# The site's own highlight themes, as JSON TextMate files — see
# highlight_themes/README.md.
extra_themes = ["highlight_themes/github-dark-high-contrast.json"]

# The landing: the hero beside its recording, then the story.
[extra.devlab.home]
layout = "wide"

[[extra.devlab.home.blocks]]
type = "hero"
eyebrow = "Version 8.0.0"
image = "/hero.gif"
image_alt = "arara building a LaTeX project in a terminal"
actions = [
  { label = "Quickstart", path = "/quickstart/" },
  { label = "Read the documentation", path = "/manual/" },
]

[[extra.devlab.home.blocks]]
type = "features"
items = [
  { kicker = "The idea", title = "Directives in the source", description = "You list the tasks in a comment line and arara runs exactly those — the build recipe lives in the document itself.", path = "/manual/introduction/" },
  { kicker = "The engine", title = "Rules, now also in Lua", description = "Every task is a rule: a name, a command, the arguments it takes. Rules speak Lua now, and the YAML era continues in graceful retirement.", path = "/manual/rules/" },
  { kicker = "The console", title = "The console talks back", description = "The styled presentation animates every task, reports every verdict, and closes the run with a summary table.", path = "/manual/console/" },
]

[[extra.devlab.home.blocks]]
type = "learn"
eyebrow = "Documentation"
title = "Learn arara"
description = "A quickstart for the impatient, a manual for the curious, and a changelog for the historians."
items = [
  { kicker = "Five minutes", title = "Quickstart", description = "Get a document building with directives before your tea cools.", path = "/quickstart/" },
  { kicker = "Fourteen chapters", title = "The arara manual", description = "The whole tool, from concepts to rule authorship — the same book the PDF tells.", path = "/manual/" },
  { kicker = "The record", title = "Changelog", description = "Every notable change to arara, kept in the Keep a Changelog style.", path = "/changelog/" },
  { kicker = "Community", title = "The arara room", description = "Questions, ideas and release chatter in arara's dedicated Matrix room.", path = "https://matrix.to/#/!HfEWIEvFtDplCLSQvz:matrix.org?via=matrix.org" },
]

[[extra.devlab.home.blocks]]
type = "workflow"
eyebrow = "How a run goes"
title = "From comment to compiled"
description = "A run is exactly what you asked for: arara reads the directives, resolves each rule, runs each task in the order you wrote, and reports every verdict on the way — nothing more, nothing less."
items = [
  { title = "Write the directives", description = "A comment line per task, right where the document lives" },
  { title = "Invoke the tool", description = "One call, one file — the run begins" },
  { title = "Watch the tasks", description = "Each rule runs in order, reported live" },
  { title = "Read the verdict", description = "A summary table closes the run" },
]

[[extra.devlab.home.blocks]]
type = "content"

[[extra.devlab.home.blocks]]
type = "cta"
title = "arara ships in TeX Live and MiKTeX"
description = "No manual deployment needed — and the CTAN page carries the story for every other case. On macOS, MacTeX cannot include arara for signing reasons — the maintenance note in the news tells the honest story."
actions = [
  { label = "Get arara from CTAN", path = "https://ctan.org/pkg/arara" },
  { label = "The project on GitLab", path = "https://gitlab.com/islandoftex/arara", style = "secondary" },
]

[extra.devlab.brand]
logo_text = "arara"
footer_text = "Island of TeX"
show_logo_mark = true
logo_mark_path = "/brand/arara-logo.svg"

[extra.devlab.appearance]
default_mode = "system"
show_toggle = true

[extra.devlab.blog]
show_reading_time = true
show_toc = true

[extra.devlab.footer]
show = true
note = "The cool TeX automation tool."
links_label = "The Island"
show_link_names = true
links = [
  { name = "Home page", path = "https://islandoftex.gitlab.io/", icon = "link" },
  { name = "GitLab", path = "https://gitlab.com/islandoftex", icon = "gitlab" },
  { name = "Community", path = "https://matrix.to/#/!titTeSvZiqNOvRIKCv:matrix.org?via=matrix.org", icon = "matrix" },
]

[extra.devlab.navigation]
links = [
  { name = "Home", path = "/" },
  { name = "Manual", collection = "manual" },
  { name = "News", path = "/news/" },
]

[extra.devlab.collections.manual]
section = "manual/_index.md"
show_breadcrumbs = true
show_toc = true
show_pagination = true
