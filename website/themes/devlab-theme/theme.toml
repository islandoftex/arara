name = "devlab-theme"
version = "0.9.0"
description = "A composable Zola theme for product sites, blogs, documentation and books."
license = "MIT"
homepage = "https://codeberg.org/RiPetitor/devlab-theme"
demo = "https://ripetitor.codeberg.page/devlab-theme/"
min_version = "0.23.6"
tags = ["documentation", "blog", "book", "product", "responsive", "search", "dark-mode"]
features = ["ordered landing blocks", "independent collections", "reader chapters", "template slots", "localized interface", "print styles", "documentation", "updates", "blog author profiles", "reading time", "search", "dark mode", "dismissible announcements", "community cards", "tera components", "synchronized tabs", "lazy diagrams", "file trees", "status badges", "accessible navigation"]

[author]
name = "RiPetitor"
homepage = "https://codeberg.org/RiPetitor"

[extra.devlab.home]
layout = "default"

[extra.devlab.brand]
show_logo_mark = false
logo_mark_path = ""

[extra.devlab.announcement]
show = false
key = ""
label = ""
message = ""
path = ""
dismissible = true

[extra.devlab.footer]
show = true
note = ""
show_link_names = false
links = []

[extra.devlab.navigation]
links = [{ name = "Home", path = "/" }]

[extra.devlab.docs]
show_breadcrumbs = true
show_toc = true
show_pagination = true

[extra.devlab.blog]
show_pagination = true
date_format = "%d.%m.%Y"
show_reading_time = true
show_toc = true

[extra.devlab.appearance]
default_mode = "system"
show_toggle = true

[extra.devlab.i18n]
rtl_languages = []

[extra.devlab.search]
enabled = true
index = ""

[extra.devlab.seo]
og_image = ""


