{% extends "base.html" %}

{% block content %}
{% set taxonomy_title = taxonomy.name | title %}
<section class="page-header">
  <h1 id="taxonomy-title">{{ taxonomy_title }}</h1>
</section>

{% if terms %}
<section class="page-list" aria-labelledby="taxonomy-title">
  {% for term in terms %}
  <article class="page-list-item">
    <h2>
      <a href="{{ term.permalink }}">{{ term.name }}</a>
    </h2>
  </article>
  {% endfor %}
</section>
{% endif %}
{% endblock content %}
