on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true
      - name: 'Build and deploy'
        uses: shalzz/zola-deploy-action@v0.23.6
        env:
          PAGES_BRANCH: gh-pages
          BUILD_DIR: website
          TOKEN: ${{ secrets.PAGE_GEN_TOKEN }}
