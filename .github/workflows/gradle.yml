# The mirror runs the cross-OS proof: the wrapped Gradle, one JDK,
# the unit suites and the runnable jar on every desktop platform;
# everything else (lint, coverage, smoke, the books) is proven once,
# on GitLab
name: Run Gradle on repo activity
on: [push, pull_request]
jobs:
  gradle:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [21, 25]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Configure checkout (line endings)
      run: git config --global core.autocrlf false && git config --global core.eol lf
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 21
        distribution: temurin
    - uses: gradle/actions/wrapper-validation@v5
    - uses: gradle/actions/setup-gradle@v5
    - name: Test and assemble
      run: ./gradlew test :cli:shadowJar
