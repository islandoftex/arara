name: Run Gradle on repo activity
on:
  push:
    branches-ignore: [gh-pages]
    tags: ['**']
  pull_request:

jobs:
  gradle:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [21, 25]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Configure checkout (line endings)
      run: git config --global core.autocrlf false && git config --global core.eol lf
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: corretto
    - uses: gradle/actions/wrapper-validation@v6
    - uses: gradle/actions/setup-gradle@v6
    - name: Build
      run: ./gradlew --build-cache build -PwarningsAsErrors=true -PtestJavaVersion=${{ matrix.java }}
    - name: Check runnable jar
      run: ./gradlew --build-cache processSmoke -PwarningsAsErrors=true
    - name: Upload smoke results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: process-smoke-${{ matrix.os }}-java${{ matrix.java }}
        path: build/test-results/processSmoke/results.xml
        if-no-files-found: warn
    - name: Upload unit test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: unit-tests-${{ matrix.os }}-java${{ matrix.java }}
        path: |
          */build/test-results/jvmTest/TEST-*.xml
          smoke-tests/build/test-results/test/TEST-*.xml
        if-no-files-found: warn
        retention-days: 7
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: arara-${{ matrix.os }}-java${{ matrix.java }}
        path: |
          cli/build/libs/*-with-deps-*.jar
          cli/build/native/jna.jar

  pages:
    needs: gradle
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/zola.yml
    secrets:
      PAGE_GEN_TOKEN: ${{ secrets.PAGE_GEN_TOKEN }}
