name: Run Gradle on repo activity
on: [push, pull_request]
jobs:
  gradle:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Configure checkout (line endings)
      run: git config --global core.autocrlf false && git config --global core.eol lf
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: corretto
    - uses: gradle/actions/wrapper-validation@v5
    - uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: current
    - name: Build
      run: ./gradlew build
    - name: Check runnable jar
      run: ./gradlew processSmoke
    - name: Upload smoke results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: process-smoke-${{ matrix.os }}
        path: build/test-results/processSmoke/results.xml
        if-no-files-found: warn
    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: arara-${{ matrix.os }}
        path: cli/build/libs/*-with-deps-*.jar
